name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build macOS app (dmg + zip, arm64 + x64)
        run: npx electron-builder --mac --publish never
        env:
          # No Apple Developer certificate on CI: skip code signing / notarization.
          # The DMG will be unsigned — on first launch macOS Gatekeeper will warn;
          # right-click the app and choose "Open" to run it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CineFlow-mac
          path: |
            release/*.dmg
            release/*.zip
